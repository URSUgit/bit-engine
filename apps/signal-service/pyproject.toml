[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-service"
version = "0.1.0"
description = "BitPrivat signal & analytics service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "motor>=3.4.0",
    "redis[hiredis]>=5.0.7",
    "aiokafka>=0.11.0",
    "asyncpg>=0.29.0",
    "transformers>=4.42.0",
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "openai>=1.35.0",
    "pydantic[email]>=2.7.0",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
