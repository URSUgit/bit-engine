name: Backend Tests

on:
  push:
    branches: [main, bit-engine, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: signal-service pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/signal-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
        working-directory: apps/signal-service

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: apps/signal-service
