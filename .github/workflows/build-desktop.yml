name: Build Desktop App

on:
  push:
    branches: [main, "claude/*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install web dependencies
        run: pnpm install
        working-directory: .

      - name: Build Next.js
        run: pnpm build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install desktop dependencies
        run: |
          for i in 1 2 3; do
            npm install && exit 0
            echo "npm install failed (attempt $i) — likely a transient Electron binary download; retrying in 15s..."
            sleep 15
          done
          echo "npm install failed after 3 attempts" >&2
          exit 1
        working-directory: apps/desktop

      - name: Build Windows portable .exe
        run: npm run build:win
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitPrivat-Windows-Installer
          path: apps/desktop/dist/*.exe
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: BitPrivat Desktop ${{ github.run_number }}
          body: |
            **BitPrivat Desktop — automatically built from branch `${{ github.ref_name }}`**

            ## Download
            - **Windows:** `BitPrivat *.exe` below (portable — no install, just run)
            - **macOS:** `BitPrivat *.dmg` below (drag to Applications)

            ## Requirements on your machine
            - Python 3.11+ from https://python.org
            - Run once in cmd: `pip install fastapi uvicorn httpx pydantic`

            ## What's inside
            - AI Agent (Anthropic Claude) with 10 trading tools
            - Polymarket bot with DRY_RUN mode by default
            - Full trading lab UI

            Built from commit ${{ github.sha }}.
          files: |
            apps/desktop/dist/*.exe
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install web dependencies
        run: pnpm install

      - name: Build Next.js
        run: pnpm build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install desktop dependencies
        run: |
          for i in 1 2 3; do
            npm install && exit 0
            echo "npm install failed (attempt $i) — likely a transient Electron binary download; retrying in 15s..."
            sleep 15
          done
          echo "npm install failed after 3 attempts" >&2
          exit 1
        working-directory: apps/desktop

      - name: Build macOS app
        run: npm run build:mac
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitPrivat-macOS
          path: apps/desktop/dist/*.dmg
          retention-days: 30

      - name: Add macOS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          files: |
            apps/desktop/dist/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
